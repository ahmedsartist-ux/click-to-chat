<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Click to chat — لوحة التحكم</title>
<meta name="theme-color" content="#201a3a">
<style>
  :root { --neon:#3dff4f; --neon-dim:rgba(61,255,79,.5); --ink:#fff; --soft:#cfcbc8; --off:#8d8b89; --card:#262240; --line:rgba(255,255,255,.14); color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100dvh; font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif; color:var(--ink);
    background:radial-gradient(90% 50% at 20% 0%,#4b3fb0 0,transparent 70%),radial-gradient(80% 45% at 90% 20%,#8a2f7a 0,transparent 70%),#1a1630;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  .wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--soft); font-size:14px; margin:0 0 18px; }
  .panel { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 14px 40px rgba(10,0,30,.35); }
  .panel h2 { font-size:15px; margin:0 0 10px; color:var(--neon); }
  label { display:block; font-size:13px; color:var(--soft); margin:10px 0 4px; }
  input { width:100%; min-height:46px; padding:0 12px; font-size:16px; color:var(--ink); background:rgba(255,255,255,.06);
    border:1px solid var(--line); border-radius:11px; }
  input:focus { outline:2px solid var(--neon); outline-offset:1px; }
  button { font:inherit; cursor:pointer; border:0; }
  .btn { min-height:48px; width:100%; margin-top:12px; border-radius:12px; font-size:16px; font-weight:600; background:var(--neon); color:#052b09; }
  .btn.sec { background:none; color:var(--neon); border:2px solid var(--neon); }
  .btn:active { transform:scale(.99); }
  .msg { margin:10px 0 0; font-size:14px; color:var(--neon); line-height:1.5; }
  .msg[hidden] { display:none; }
  .msg.err { color:#ff8a7a; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; }
  .lic-row { list-style:none; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin:0 0 9px; }
  .row-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row-name { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-code { font-size:15px; color:var(--soft); direction:ltr; unicode-bidi:isolate; letter-spacing:1px; margin-top:3px; font-variant-numeric:tabular-nums; }
  .row-exp { font-size:13px; color:var(--off); margin-top:2px; }
  .row-exp:empty { display:none; }
  .badge { font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:999px; flex:none; }
  .badge.ok { color:#052b09; background:var(--neon); }
  .badge.off { color:#ff8a7a; border:1px solid #ff8a7a; }
  .row-btns { display:flex; gap:8px; margin-top:11px; }
  .mini { flex:1; min-height:40px; border-radius:10px; font-size:14px; font-weight:600; color:var(--neon); border:1.5px solid var(--neon); background:none; }
  .mini.danger { color:#ff8a7a; border-color:rgba(255,138,122,.6); }
  ul { padding:0; margin:14px 0 0; }
  .hide, [hidden] { display:none !important; }
  .fine { font-size:12.5px; color:var(--off); margin-top:10px; line-height:1.6; }
  code { direction:ltr; unicode-bidi:isolate; background:rgba(255,255,255,.08); padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة تحكم Click to chat</h1>
  <p class="sub">فعّل وإقفل الناس اللي معاهم النسخة المدفوعة.</p>

  <section id="gate" class="panel">
    <h2>الدخول</h2>
    <p id="passHint" class="sub" style="margin:0 0 8px"></p>
    <input id="passInput" type="password" placeholder="الباسورد" autocomplete="off">
    <button id="passGo" class="btn">دخول</button>
    <p id="passMsg" class="msg" hidden></p>
  </section>

  <div id="main" hidden>
    <section class="panel">
      <h2>توكن GitHub</h2>
      <p class="sub" style="margin:0 0 6px">محفوظ على الجهاز ده بس. الريبو: <span id="repoInfo"></span></p>
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
      <button id="tokenSave" class="btn sec">حفظ التوكن</button>
      <p id="tokenMsg" class="msg" hidden></p>
    </section>

    <section class="panel">
      <h2>تفعيل حد جديد</h2>
      <label for="codeInput">كود الجهاز (اللي العميل بعتهولك)</label>
      <input id="codeInput" type="text" placeholder="AAAA-BBBB-CCCC-DDDD" dir="ltr" autocomplete="off">
      <div class="row2">
        <div><label for="nameInput">الاسم (اختياري)</label><input id="nameInput" type="text" placeholder="اسم العميل" autocomplete="off"></div>
        <div><label for="expInput">ينتهي في (اختياري)</label><input id="expInput" type="date"></div>
      </div>
      <button id="activateBtn" class="btn">تفعيل</button>
      <p id="formMsg" class="msg" hidden></p>
    </section>

    <section class="panel">
      <h2>الناس المفعّلين</h2>
      <button id="refreshBtn" class="btn sec" style="margin-top:0">تحديث القايمة</button>
      <ul id="list"></ul>
      <p id="listMsg" class="msg" hidden></p>
      <p class="fine">القفل بيوصل للعميل أول ما يفتح التطبيق ويكون أونلاين (خلال دقيقة). لو قافل النت، بيفضل شغّال لمدة قصيرة لحد ما يتصل.</p>
    </section>
  </div>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
